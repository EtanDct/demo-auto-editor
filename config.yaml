# Configuration centralisée du pipeline (voir docs/plan-technique.md, section 10)
# Toutes les valeurs ci-dessous sont modifiables ; les défauts fonctionnent
# dès l'installation sur une machine 16 Go RAM sans GPU.

paths:
  input_video: input/source.mp4
  data_dir: data
  audio_dir: audio
  frames_dir: frames
  overlays_dir: overlays
  models_dir: models
  output_dir: output
  logs_dir: logs

hardware:
  # auto: détecté au lancement (voir scripts/hardware.py) et journalisé dans logs/hardware.json
  # cpu / cuda: force le mode
  device: auto

inspection:
  thumbnail_interval_seconds: 2.0

screen_text:
  # Index du texte affiché à l'écran (étape `screen`), base du montage automatique.
  sample_fps: 2.0          # échantillonnage temporel de la vidéo
  min_confidence: 0.6      # en dessous, la détection OCR est ignorée
  min_text_length: 2       # écarte le bruit d'OCR sur les icônes (symboles isolés)
  # L'OCR n'est relancé que si l'écran a bougé, sinon la frame hérite des
  # détections précédentes. Le seuil porte sur la PROPORTION de pixels touchés,
  # pas sur l'écart moyen : les changements utiles sont localisés.
  change_pixel_delta: 25   # écart par pixel (0-255) au-delà duquel il a changé
  change_ratio: 0.0005     # 0.05 % des pixels ; plus bas = plus précis et plus lent
  # Plafond de coût : sur une source au mouvement permanent (lecteur vidéo,
  # animation, webcam incrustée) toutes les frames franchiraient le seuil. Le
  # seuil est alors relevé automatiquement pour tenir sous ce plafond, ce qui
  # borne la durée de l'étape (~5 s d'OCR par frame) quel que soit le contenu.
  max_ocr_frames: 200
  merge_iou: 0.6           # recouvrement minimal pour considérer deux détections
                           # de frames différentes comme le même élément
  max_gap_seconds: 1.0     # au-delà, un élément revu est un nouvel élément

whisper:
  # tiny (tests rapides) / small (défaut) / medium (précision accrue)
  model_repo: Systran/faster-whisper-small
  model_size: small
  compute_type: auto
  language: fr

llm:
  # Modèle de traduction + conducteur de montage, tiré directement de Hugging Face.
  repo_id: bartowski/Qwen2.5-3B-Instruct-GGUF
  filename: Qwen2.5-3B-Instruct-Q4_K_M.gguf
  n_ctx: 8192
  n_gpu_layers: auto
  temperature: 0.2

tts:
  engine: piper
  piper_repo_id: rhasspy/piper-voices
  voice: en_US-amy-medium
  sample_rate: 22050

retiming:
  max_speed_factor: 1.08
  min_speed_factor: 0.95
  min_pause_ms: 80

subtitles:
  max_chars_per_line: 42
  max_lines: 2
  font_path: null  # ex: "C:/Windows/Fonts/arial.ttf" ; null = police par défaut FFmpeg

cursor:
  # Suivi du pointeur (étape `cursor`), second signal du montage automatique.
  # Aucun gabarit de curseur : on cherche une petite zone qui se déplace, ce qui
  # reste vrai quels que soient la forme du pointeur, le thème et la résolution.
  pixel_delta: 25              # écart par pixel au-delà duquel il a changé
  min_area_fraction: 0.00002   # ~40 px sur du 1920x1020 : plus petit = bruit
  max_area_fraction: 0.002     # ~4000 px : plus grand = ce n'est pas un pointeur
  match_tolerance_fraction: 0.01  # tolérance d'appariement entre deux écarts
  hold_seconds: 2.0            # durée pendant laquelle une position reste valable

overlay_matching:
  # Appariement entre ce que le narrateur nomme (ui_reference) et ce que l'OCR
  # a lu à l'écran. Réglé pour la précision, pas pour le rappel : une
  # incrustation au mauvais endroit décrédibilise toute la vidéo, une
  # incrustation manquante ne se voit pas.
  min_score: 0.75              # en dessous, le libellé ne correspond pas assez
  ambiguity_margin: 0.1        # deux candidats à moins de ça = ambigu, on renonce
  # Le pointeur ne départage que s'il est SUR le candidat : la boîte OCR ne
  # couvre que le texte, pas toute la zone cliquable, d'où une marge étroite.
  # Plus large (0.06 testé), un pointeur qui passe à côté suffisait à trancher.
  cursor_max_distance: 0.02    # 0 = désactive l'arbitrage par le pointeur
  min_visible_fraction: 0.5    # l'élément doit être affiché la moitié du segment
  min_box_area: 0.0002         # sous ce seuil, boîte trop petite pour être crédible
  max_box_area: 0.25           # au-dessus, l'OCR a capturé un bloc, pas un contrôle
  time_margin_seconds: 1.0     # tolérance autour du segment (le narrateur anticipe)
  action_type: highlight       # effet posé sur les correspondances retenues

overlays:
  # Fondu d'entrée/sortie des effets minutés. drawtext fond réellement (son
  # alpha accepte une expression) ; drawbox ne sait animer ni son alpha ni son
  # épaisseur, son fondu est donc approché par paliers d'opacité.
  fade_seconds: 0.25   # 0 = apparition franche
  fade_steps: 4        # paliers du fondu des cadres ; plus haut = plus doux
  font_path: null  # ex: "C:/Windows/Fonts/arialbd.ttf" ; requis pour callout/popup sous Windows
  highlight_color: "yellow"
  callout_color: "white"
  line_width: 4

export:
  container: mp4
  video_codec: libx264
  audio_codec: aac
  audio_sample_rate: 48000
  crf: 18
  preview_max_height: 480

glossary_file: data/glossary.yaml
